name = "rmr-visitors"
main = "src/index.js"
compatibility_date = "2025-09-01"
# Served on the site's own domain; the workers.dev address would publish the account's subdomain.
workers_dev = false
routes = [{ pattern = "visits.rmrtech.dev", custom_domain = true }]

[vars]
# Comma-separated origins allowed to call the API.
ALLOWED_ORIGINS = "https://rmrtech.dev,https://www.rmrtech.dev,https://rmrtechdev.github.io,http://localhost:3000,http://localhost:5173,http://localhost:4173"

[[d1_databases]]
binding = "DB"
database_name = "rmr-visitors"
database_id = "0c614c39-1218-40f8-aa6a-d2948b1a5f02"

