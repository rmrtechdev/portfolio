# rmrtech.dev on the VPS, at /srv/rmrtech. Independent of the client stacks under /opt.
services:
  site:
    image: nginx:1.27-alpine
    container_name: rmrtech-site
    restart: unless-stopped
    ports:
      - 127.0.0.1:8090:80
    volumes:
      - ./site:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [rmrtech-net]

  contact:
    # The form's /api/contact (contact/app.py), reached only through the site's nginx.
    image: python:3.12-alpine
    container_name: rmrtech-contact
    restart: unless-stopped
    command: python /app/app.py
    volumes:
      - ./contact:/app:ro
    # SMTP_PASS for form@rmrtech.dev; root-only on the VPS.
    env_file: contact.env
    # mail.rmrtech.dev is published on the host, so the TLS certificate matches without joining the mail network.
    extra_hosts:
      - mail.rmrtech.dev:host-gateway
    networks: [rmrtech-net]

  tunnel:
    # Pinned: an unattended `latest` pull is not something this site should depend on.
    image: cloudflare/cloudflared:2026.6.1
    container_name: rmrtech-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    # TUNNEL_TOKEN only; kept out of the command line so `docker inspect` never shows it.
    env_file: tunnel.env
    depends_on: [site]
    networks: [rmrtech-net]

networks:
  rmrtech-net:
    external: true
